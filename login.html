<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar · SACV</title>
<meta name="description" content="Acesso restrito à GELOT / SEDUC-AM.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<!--
  SACV · LOGIN (protótipo estático)
  Card de login centralizado sobre a grade de planilha (mesmo fundo da home).
  Acesso por usuário e senha (sem SSO/Keycloak).
  Estado de erro: abra login.html?erro=1 ou envie o formulário com a senha "erro".
  Lógica de demonstração em js/login.js (trocar pela integração real).
-->
</head>
<body>
<a class="pular" href="#usuario">Pular para o formulário</a>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-arrow-left" viewBox="0 0 24 24"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></symbol>
  <symbol id="i-log-in" viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" x2="3" y1="12" y2="12"/></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-eye-off" viewBox="0 0 24 24"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/><path d="m2 2 20 20"/></symbol>
  <symbol id="i-circle-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></symbol>
  <symbol id="i-circle-alert"viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></symbol>
</svg>

<div class="entrada">
  <div class="faixa-identidade" aria-hidden="true"></div>
  <!-- Fundo animado: SVG autocontido (grade + células + animação dentro do arquivo).
       js/fundo.js só dá a partida: copia data-src para src. data-duracao = duração da
       animação no SVG, para avisar a página quando termina (evento "fundo:pronto"). -->
  <img class="fundo-svg" data-src="assets/img/fundo-login.svg" data-duracao="1840" alt="" aria-hidden="true">

  <main class="entrada__centro" data-component="FormLogin">
    <a class="marca" href="index.html" aria-label="SACV, voltar ao início">
      <img class="marca__simbolo" src="assets/marca/sacv-icone.svg" alt="" width="40" height="40">
      <span class="marca__nome"><strong>SAC<span>V</span></strong><small>Sistema de Automação de Cargas Vagas</small></span>
    </a>

    <form class="cartao-login" id="form-login" novalidate>
      <div class="cartao-login__cabecalho">
        <span class="cartao-login__cadeado" aria-hidden="true"><svg class="icone"><use href="#i-lock"/></svg></span>
        <h1 class="cartao-login__titulo">Acesso restrito à GELOT</h1>
        <p class="cartao-login__apoio">Entre com sua conta institucional.</p>
      </div>

      <div class="alerta" id="erro-login" role="alert" hidden>
        <svg class="icone" aria-hidden="true"><use href="#i-circle-alert"/></svg>
        <span id="erro-texto">Usuário ou senha incorretos. Tente de novo.</span>
      </div>

      <div class="campo">
        <label for="usuario">Usuário</label>
        <input id="usuario" name="usuario" type="text" autocomplete="username" placeholder="nome.sobrenome">
      </div>
      <div class="campo campo--senha">
        <div class="campo__linha">
          <label for="senha">Senha</label>
          <a href="#">Esqueci minha senha</a>
        </div>
        <div class="campo__caixa">
          <input id="senha" name="senha" type="password" autocomplete="current-password">
          <button class="campo__olho" type="button" id="btn-olho" aria-label="Mostrar senha" aria-pressed="false">
            <svg class="icone" aria-hidden="true"><use href="#i-eye"/></svg>
          </button>
        </div>
      </div>

      <button class="btn btn--primario btn--bloco" type="submit">
        <svg class="icone" aria-hidden="true"><use href="#i-log-in"/></svg>
        Entrar
      </button>

      <p class="cartao-login__ajuda">Problemas de acesso? <a href="#">Fale com a equipe de TI.</a></p>
    </form>

    <a class="entrada__voltar" href="index.html">
      <svg class="icone" aria-hidden="true"><use href="#i-arrow-left"/></svg>
      Voltar ao início
    </a>
  </main>

  <footer class="entrada__rodape">
    <span class="entrada__selo"><img src="assets/img/assinatura-seduc.svg" alt="Secretaria de Estado de Educação e Desporto Escolar – Governo do Amazonas" width="190" height="58"></span>
    <small>© 2026 SACV · GELOT / SEDUC-AM</small>
  </footer>
</div>

<script src="js/fundo.js"></script>
<script src="js/login.js"></script>
</body>
</html>
